<text x="285" y="92" fill="#0a2a57" font-family="Arial" font-size="30" font-weight="700">Data movement policies</text><text x="285" y="126" fill="#60758d" font-family="Arial" font-size="16">Apply one classification policy across every exit route.</text>
<g font-family="Arial"><g transform="translate(285 165)"><rect width="825" height="76" rx="14" fill="#f8fafc" stroke="#d9e3ef"/><circle cx="42" cy="38" r="20" fill="#e9f2ff"/><text x="42" y="44" text-anchor="middle" fill="#1565d8" font-size="13" font-weight="700">USB</text><text x="80" y="34" fill="#0a2a57" font-size="18" font-weight="700">Removable media protection</text><text x="80" y="56" fill="#60758d" font-size="14">Block confidential files · allow approved encrypted devices</text><rect x="700" y="23" width="92" height="30" rx="15" fill="#e8f8ef"/><text x="746" y="44" text-anchor="middle" fill="#138746" font-size="13" font-weight="700">ENFORCED</text></g>
<g transform="translate(285 260)"><rect width="825" height="76" rx="14" fill="#f8fafc" stroke="#d9e3ef"/><circle cx="42" cy="38" r="20" fill="#fff3e4"/><text x="42" y="44" text-anchor="middle" fill="#b45a00" font-size="12" font-weight="700">WEB</text><text x="80" y="34" fill="#0a2a57" font-size="18" font-weight="700">Web, cloud and SaaS uploads</text><text x="80" y="56" fill="#60758d" font-size="14">Inspect content before upload · warn, log or block</text><rect x="700" y="23" width="92" height="30" rx="15" fill="#e8f8ef"/><text x="746" y="44" text-anchor="middle" fill="#138746" font-size="13" font-weight="700">ENFORCED</text></g>
<g transform="translate(285 355)"><rect width="825" height="76" rx="14" fill="#f8fafc" stroke="#d9e3ef"/><circle cx="42" cy="38" r="20" fill="#f0eafd"/><text x="42" y="44" text-anchor="middle" fill="#6936bd" font-size="13" font-weight="700">AI</text><text x="80" y="34" fill="#0a2a57" font-size="18" font-weight="700">Public GenAI governance</text><text x="80" y="56" fill="#60758d" font-size="14">Protect prompts, pasted text and files sent to AI tools</text><rect x="700" y="23" width="92" height="30" rx="15" fill="#e8f8ef"/><text x="746" y="44" text-anchor="middle" fill="#138746" font-size="13" font-weight="700">ENFORCED</text></g>
